name: Build Windows release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Run tests
        run: python -B -m unittest discover -v
      - name: Build standalone application
        run: python -B -m PyInstaller --noconfirm SteamVRWallpaperPause.spec
      - name: Build installer
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'Inno Setup 6 is missing from the runner image' }
          & $compiler installer/setup.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - name: Verify packages and prepare checksums
        run: python -B scripts/verify_release.py
      - name: Upload verified packages
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-release-${{ github.sha }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
